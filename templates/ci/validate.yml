# Template para ativação futura do CI nos runners autorizados.
name: Validate Python SDK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raims-python-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'
  RAIMS_PYTHON_TOOLKIT_REF: ${{ vars.RAIMS_PYTHON_TOOLKIT_REF }}

jobs:
  validatePython:
    if: github.repository == 'raimshq/raims-python'
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10.22', '3.14.10']
    runs-on:
      - codebuild-raims-github-actions-${{ github.run_id }}-${{ github.run_attempt }}
      - python-sdk-check-${{ matrix.python }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout the repository commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: Raims-Python
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}

      - name: Require the reviewed validation tooling revision
        run: |
          python - <<'PY'
          import os
          import re
          revision = os.environ.get('RAIMS_PYTHON_TOOLKIT_REF', '')
          if not re.fullmatch(r'[0-9a-f]{40}', revision):
              raise SystemExit('Configure RAIMS_PYTHON_TOOLKIT_REF with the reviewed Toolkit commit SHA.')
          PY

      - name: Create a read-only validation source token
        id: sources
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.RAIMS_CI_SOURCE_READER_CLIENT_ID }}
          private-key: ${{ secrets.RAIMS_CI_SOURCE_READER_PRIVATE_KEY }}
          owner: raimshq
          repositories: Raims-Developer-Toolkit
          permission-contents: read

      - name: Checkout the reviewed validation tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: raimshq/Raims-Developer-Toolkit
          ref: ${{ env.RAIMS_PYTHON_TOOLKIT_REF }}
          path: Developer-Toolkit
          token: ${{ steps.sources.outputs.token }}
          persist-credentials: false

      - name: Run the canonical SDK checks
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          workspace = Path(os.environ['GITHUB_WORKSPACE'])
          shutil.copyfile(workspace / 'Raims-Python/AGENTS.md', workspace / 'AGENTS.md')
          output = workspace / '.tmp/raims-python-sdk' / ('ci-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'] + '-' + sys.version.split()[0])
          subprocess.run([sys.executable, str(workspace / 'Raims-Python/scripts/check.py'), '--output', str(output), '--prepare-tools'], check=True)
          PY
