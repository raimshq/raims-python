[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "raims"
dynamic = ["version"]
description = "SDK Python para a API pública da Raims"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Raims" }]
dependencies = ["httpx>=0.28.1,<0.29"]
keywords = ["raims", "sdk", "payments", "pix"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.urls]
Documentation = "https://docs.raims.com/br/api"
Repository = "https://github.com/raimshq/raims-python"
Issues = "https://github.com/raimshq/raims-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/raims"]

[tool.hatch.version]
path = "src/raims/_version.py"

[tool.hatch.build.targets.sdist]
include = ["/src/raims", "/scripts", "/contracts", "/docs", "/README.md", "/CONTRIBUTING.md", "/SECURITY.md", "/LICENSE", "/pyproject.toml", "/AGENTS.md"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
